version: '2'
services:
  lint:
    image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    volumes:
      - ".:/plugin:ro"
    entrypoint: sh
    command:
      - -c
      - 'shellcheck ./plugin/*.sh'

  tests:
    image: buildkite/plugin-tester:v4.4.0@sha256:227f1ca092928541e52dc82a4af51943bc3e69451fe7eb4473e484f66e3a4447
    volumes:
      - ".:/plugin:ro"
